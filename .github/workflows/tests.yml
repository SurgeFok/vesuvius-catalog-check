name: tests

on:
  push:
  pull_request:
  schedule:
    # The catalog is live; a check that passes today can fail tomorrow.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install pytest numpy tifffile opencv-python-headless
      - run: python -m pytest tests/ -v
